name: Deploy auxiliary utility service

on:
  push:
    branches: [main]
    paths:
      - "services/offer-auth/**"
      - ".github/workflows/deploy-offer-auth.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GITHUB_OAUTH_CLIENT_ID: ${{ secrets.GITHUB_OAUTH_CLIENT_ID }}
      GITHUB_OAUTH_CLIENT_SECRET: ${{ secrets.GITHUB_OAUTH_CLIENT_SECRET }}
      OFFER_SESSION_SECRET: ${{ secrets.OFFER_SESSION_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy Worker and configure secrets
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        working-directory: services/offer-auth
        run: |
          npx --yes wrangler@4 deploy
          if [ -n "$GITHUB_OAUTH_CLIENT_ID" ]; then
            printf '%s' "$GITHUB_OAUTH_CLIENT_ID" | npx --yes wrangler@4 secret put GITHUB_CLIENT_ID
          fi
          if [ -n "$GITHUB_OAUTH_CLIENT_SECRET" ]; then
            printf '%s' "$GITHUB_OAUTH_CLIENT_SECRET" | npx --yes wrangler@4 secret put GITHUB_CLIENT_SECRET
          fi
          if [ -n "$OFFER_SESSION_SECRET" ]; then
            printf '%s' "$OFFER_SESSION_SECRET" | npx --yes wrangler@4 secret put SESSION_SECRET
          fi

      - name: Explain required Cloudflare setup
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == '' }}
        run: |
          echo "Cloudflare credentials are not configured yet."
          echo "Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in repository Actions secrets, then run this workflow again."
