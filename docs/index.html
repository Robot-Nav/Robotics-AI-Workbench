<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Robotics AI Workbench</title>
  <meta name="description" content="Robot-Nav 的机器人、Physical AI、Agent Engineering 与 AI 驱动研发知识库。">
  <meta name="theme-color" content="#2563eb">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <link rel="stylesheet" href="assets/custom.css">
</head>
<body>
  <div id="app">正在加载 Robotics AI Workbench...</div>
  <script>
    const GITHUB_REPO = 'Robot-Nav/Robotics-AI-Workbench';
    window.$docsify = {
      name: 'Robotics AI Workbench',
      repo: 'https://github.com/' + GITHUB_REPO,
      homepage: 'README.md',
      // Prevent caches from serving stale Markdown after a Pages update.
      requestHeaders: {
        'Cache-Control': 'no-cache',
        'Pragma': 'no-cache'
      },
      loadSidebar: true,
      loadNavbar: true,
      subMaxLevel: 3,
      auto2top: true,
      notFoundPage: '404.md',
      search: {
        paths: 'auto',
        placeholder: '搜索算法、技术、问题与解决方案...',
        noData: '没有找到相关内容',
        depth: 6
      },
      pagination: {
        previousText: '上一篇',
        nextText: '下一篇',
        crossChapter: true,
        crossChapterText: true
      },
      copyCode: {
        buttonText: '复制',
        errorText: '复制失败',
        successText: '已复制'
      },
      plugins: [
        function (hook, vm) {
          hook.afterEach(function (html) {
            const file = String(vm.route.file || 'README.md').replace(/^\/+/, '');
            const encoded = file.split('/').map(encodeURIComponent).join('/');
            const url = 'https://github.com/' + GITHUB_REPO + '/edit/main/docs/' + encoded;
            return html +
              '<hr><div class="page-edit">' +
              '<a href="' + url + '" target="_blank" rel="noopener noreferrer">✏️ 在 GitHub 上编辑此页</a>' +
              '<span>发现错误或有新的想法？可以直接修改 Markdown。</span>' +
              '</div>';
          });
          hook.doneEach(function () {
            if (window.renderDocsifyMath) {
              window.renderDocsifyMath();
            }
          });
        }
      ]
    };
    // Docsify inserts Markdown dynamically. Typeset each completed page explicitly.
    window.__docsifyMathPending = false;
    window.__docsifyMathTypesetPromise = Promise.resolve();
    window.renderDocsifyMath = function () {
      const mathJax = window.MathJax;
      if (!mathJax || !mathJax.startup || !mathJax.startup.promise ||
          typeof mathJax.typesetPromise !== 'function') {
        window.__docsifyMathPending = true;
        return;
      }
      const app = document.getElementById('app');
      if (!app) return;
      window.__docsifyMathTypesetPromise =
        window.__docsifyMathTypesetPromise
          .catch(function () {})
          .then(function () { return mathJax.startup.promise; })
          .then(function () {
            const currentApp = document.getElementById('app');
            if (!currentApp) return;
            mathJax.typesetClear([currentApp]);
            return mathJax.typesetPromise([currentApp]);
          })
          .then(function () {
            window.__docsifyMathPending = false;
          })
          .catch(function (error) {
            console.error('MathJax typesetting failed:', error);
          });
    };
    window.MathJax = {
      startup: { typeset: false },
      tex: {
        inlineMath: [['$', '$'], ['\\\\(', '\\\\)']],
        displayMath: [['$$', '$$'], ['\\\\[', '\\\\]']]
      },
      options: {
        skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
      }
    };

    // Prefer a mainland-friendly CDN, then fall back to independent CDNs.
    (function loadMathJaxWithFallback() {
      const sources = [
        'https://cdn.bootcdn.net/ajax/libs/mathjax/3.2.2/es5/tex-mml-chtml.min.js',
        'https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js',
        'https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-mml-chtml.min.js'
      ];
      let sourceIndex = 0;

      function showLoadError() {
        console.error('MathJax could not be loaded from any configured CDN.');
        if (document.getElementById('mathjax-load-error')) return;
        const notice = document.createElement('div');
        notice.id = 'mathjax-load-error';
        notice.textContent = '数学公式组件加载失败，请检查网络或 CDN 连接后刷新页面。';
        notice.style.cssText =
          'position:fixed;left:12px;right:12px;bottom:12px;z-index:99999;' +
          'padding:10px 14px;background:#fff3cd;color:#664d03;' +
          'border:1px solid #ffecb5;border-radius:6px;font-size:14px;';
        document.body.appendChild(notice);
      }

      function loadNextSource() {
        if (sourceIndex >= sources.length) {
          showLoadError();
          return;
        }
        const src = sources[sourceIndex++];
        const script = document.createElement('script');
        script.src = src;
        script.async = true;
        script.onload = function () {
          const mathJax = window.MathJax;
          if (!mathJax || !mathJax.startup || !mathJax.startup.promise) {
            loadNextSource();
            return;
          }
          mathJax.startup.promise.then(function () {
            window.__mathJaxLoaded = true;
            if (window.__docsifyMathPending) window.renderDocsifyMath();
          }).catch(function (error) {
            console.error('MathJax startup failed:', error);
            loadNextSource();
          });
        };
        script.onerror = function () {
          console.warn('MathJax CDN unavailable:', src);
          loadNextSource();
        };
        document.head.appendChild(script);
      }

      loadNextSource();
    })();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-pagination@2/dist/docsify-pagination.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/zoom-image.min.js"></script>
</body>
</html>
